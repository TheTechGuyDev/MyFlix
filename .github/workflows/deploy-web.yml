name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "mobile/**", "admin/**", "scripts/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Public Supabase URL + publishable key for the front ends (safe to ship to browsers)
      - name: Supabase settings
        run: bash scripts/supabase-public-env.sh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      # Web platform (Next.js) -> /MyFlix/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            admin/package-lock.json
      - run: npm ci && npm test
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /MyFlix

      # Admin dashboard (Next.js) -> /MyFlix/admin/
      - run: npm ci && npm test
        working-directory: admin
      - run: npm run build
        working-directory: admin
        env:
          NEXT_PUBLIC_BASE_PATH: /MyFlix/admin
          NEXT_PUBLIC_SITE_URL: /MyFlix/
      - run: cp -r admin/out web/out/admin

      # Mobile app web preview (Flutter) -> /MyFlix/app/
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: flutter build web --release --no-web-resources-cdn --base-href /MyFlix/app/ --dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_KEY=$SUPABASE_PUBLIC_KEY
        working-directory: mobile
      - run: cp -r mobile/build/web web/out/app && touch web/out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
