name: Daily membership renewals

on:
  schedule:
    - cron: "17 6 * * *"   # 07:17 Lagos time
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Run renewals
        run: |
          [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$REF" ]] && { echo "Backend not configured yet"; exit 0; }
          CRON_SECRET=$(printf '%s' "$SUPABASE_ACCESS_TOKEN:cron:$REF" | sha256sum | cut -c1-48)
          echo "::add-mask::$CRON_SECRET"
          curl -fsS -X POST "https://$REF.supabase.co/functions/v1/renewals" -H "x-cron-secret: $CRON_SECRET" -H "Content-Type: application/json" -d '{}'
