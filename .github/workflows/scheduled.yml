name: Hourly scheduled jobs

on:
  schedule:
    - cron: "7 * * * *"   # every hour
  workflow_dispatch:

jobs:
  campaigns:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Send scheduled campaigns
        run: |
          [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$REF" ]] && { echo "Backend not configured yet"; exit 0; }
          CRON_SECRET=$(printf '%s' "$SUPABASE_ACCESS_TOKEN:cron:$REF" | sha256sum | cut -c1-48)
          echo "::add-mask::$CRON_SECRET"
          curl -fsS -X POST "https://$REF.supabase.co/functions/v1/campaigns" -H "x-cron-secret: $CRON_SECRET" -H "Content-Type: application/json" -d '{"action":"due"}'
