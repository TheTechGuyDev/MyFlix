name: Deploy Supabase backend

# Applies database migrations, deploys edge functions, syncs secrets and configures Auth.
# Repository secrets needed: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD.
# Optional (features switch on when present): PAYSTACK_SECRET_KEY, MUX_TOKEN_ID, MUX_TOKEN_SECRET,
# MUX_WEBHOOK_SECRET, RESEND_API_KEY, EMAIL_FROM, TERMII_API_KEY, TERMII_SENDER_ID, ADMIN_OWNER_EMAIL.

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migrations + security rules test
        env:
          PGPASSWORD: postgres
        run: |
          P="psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q"
          $P -c "create database t"
          $P -d t -f supabase/tests/supabase_stub.sql
          for f in supabase/migrations/*.sql; do echo "== $f"; $P -d t -f "$f"; done
          psql -h localhost -U postgres -d t -f supabase/tests/rls_test.sql > rls.out 2>&1 || true
          cat rls.out
          bash supabase/tests/check_rls_output.sh rls.out
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Edge function type check + unit tests
        working-directory: supabase/functions
        run: |
          for f in */index.ts; do deno check --quiet "$f"; done
          deno test -A --quiet ../tests/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SITE_URL: https://thetechguydev.github.io/MyFlix
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$REF" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF and SUPABASE_DB_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Link project
        run: supabase link --project-ref "$REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: |
          set -o pipefail
          if ! supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all --yes 2>&1 | tee push.log; then
            # Surface the database error as annotations (visible without downloading logs)
            grep -iE "error|ERROR|failed|hint|detail|at statement" push.log | tail -15 | while read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Sync function secrets
        env:
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
          MUX_WEBHOOK_SECRET: ${{ secrets.MUX_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          TERMII_API_KEY: ${{ secrets.TERMII_API_KEY }}
          TERMII_SENDER_ID: ${{ secrets.TERMII_SENDER_ID }}
          ADMIN_OWNER_EMAIL: ${{ secrets.ADMIN_OWNER_EMAIL }}
        run: |
          # Secrets shared between this workflow and the functions, derived so no extra setup is needed
          CRON_SECRET=$(printf '%s' "$SUPABASE_ACCESS_TOKEN:cron:$REF" | sha256sum | cut -c1-48)
          EMAIL_HOOK=$(printf '%s' "$SUPABASE_ACCESS_TOKEN:email-hook:$REF" | sha256sum | cut -c1-32 | base64 -w0)
          SMS_HOOK=$(printf '%s' "$SUPABASE_ACCESS_TOKEN:sms-hook:$REF" | sha256sum | cut -c1-32 | base64 -w0)
          echo "::add-mask::$CRON_SECRET"; echo "::add-mask::$EMAIL_HOOK"; echo "::add-mask::$SMS_HOOK"
          echo "EMAIL_HOOK=$EMAIL_HOOK" >> "$GITHUB_ENV"; echo "SMS_HOOK=$SMS_HOOK" >> "$GITHUB_ENV"
          args=("SITE_URL=$SITE_URL" "CRON_SECRET=$CRON_SECRET" "SEND_EMAIL_HOOK_SECRET=v1,whsec_$EMAIL_HOOK" "SEND_SMS_HOOK_SECRET=v1,whsec_$SMS_HOOK")
          for k in PAYSTACK_SECRET_KEY MUX_TOKEN_ID MUX_TOKEN_SECRET MUX_WEBHOOK_SECRET RESEND_API_KEY EMAIL_FROM TERMII_API_KEY TERMII_SENDER_ID ADMIN_OWNER_EMAIL; do
            [[ -n "${!k}" ]] && args+=("$k=${!k}")
          done
          supabase secrets set --project-ref "$REF" "${args[@]}" > /dev/null
          echo "Synced ${#args[@]} secrets"

      - name: Deploy edge functions
        run: supabase functions deploy --project-ref "$REF" --use-api

      - name: Configure Auth (URLs, email, SMS, two-step sign-in)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TERMII_API_KEY: ${{ secrets.TERMII_API_KEY }}
        run: |
          FN="https://$REF.supabase.co/functions/v1"
          email=false; sms=false
          [[ -n "$RESEND_API_KEY" ]] && email=true
          [[ -n "$TERMII_API_KEY" ]] && sms=true
          body=$(jq -n --arg site "$SITE_URL" --arg fn "$FN" --arg eh "v1,whsec_$EMAIL_HOOK" --arg sh "v1,whsec_$SMS_HOOK" \
            --argjson email $email --argjson sms $sms '{
              site_url: $site,
              uri_allow_list: ($site + "/**,ng.myflix.myflix://callback,http://localhost:3000/**"),
              password_min_length: 6,
              mailer_otp_exp: 600,
              mailer_otp_length: 6,
              mfa_totp_enroll_enabled: true,
              mfa_totp_verify_enabled: true,
              mfa_max_enrolled_factors: 5,
              security_refresh_token_reuse_interval: 10,
              mailer_autoconfirm: ($email | not),
              hook_send_email_enabled: $email,
              hook_send_email_uri: (if $email then ($fn + "/auth-email-hook") else null end),
              hook_send_email_secrets: (if $email then $eh else null end),
              external_phone_enabled: $sms,
              sms_otp_exp: 600,
              sms_otp_length: 6,
              hook_send_sms_enabled: $sms,
              hook_send_sms_uri: (if $sms then ($fn + "/auth-sms-hook") else null end),
              hook_send_sms_secrets: (if $sms then $sh else null end)
            } | with_entries(select(.value != null))')
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$body" > /dev/null
          # Tell the apps which sign-in options are live
          sql="update public.site_settings set data = data || jsonb_build_object('smsEnabled', $sms, 'emailCodesEnabled', $email) where id = 1;"
          q=$(jq -n --arg q "$sql" '{query: $q}')
          curl -fsS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$q" > /dev/null
          echo "Auth configured (email provider: $email, SMS: $sms)"

      - name: Summary
        run: |
          {
            echo "### MyFlix backend deployed"
            echo "- API: https://$REF.supabase.co"
            echo "- Paystack webhook URL: https://$REF.supabase.co/functions/v1/paystack-webhook"
            echo "- Mux webhook URL (optional): https://$REF.supabase.co/functions/v1/mux-webhook"
          } >> "$GITHUB_STEP_SUMMARY"
